<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" fill="none">
  <!-- Barq Real Estate Geometric Diamond Icon -->
  <g id="barq-symbol" transform="translate(0, 15)">
    <!-- Outer Diamond Frame -->
    <path 
      d="M 150 20 
         L 265 135 
         L 150 250 
         L 105 205" 
      stroke="currentColor" 
      stroke-width="11" 
      stroke-linecap="square" 
      stroke-linejoin="miter"
    />
    
    <!-- Top Left Diamond Edge -->
    <path 
      d="M 150 20 
         L 115 55" 
      stroke="currentColor" 
      stroke-width="11" 
      stroke-linecap="square"
    />

    <!-- Left Chevron (<) -->
    <path 
      d="M 105 85 
         L 40 140 
         L 85 178" 
      stroke="currentColor" 
      stroke-width="11" 
      stroke-linecap="square" 
      stroke-linejoin="miter"
    />

    <!-- Vertical Stem 1 (Left narrow stem) -->
    <line 
      x1="95" y1="78" 
      x2="95" y2="175" 
      stroke="currentColor" 
      stroke-width="11" 
      stroke-linecap="square"
    />

    <!-- Vertical Stem 2 (Main stem of B) -->
    <line 
      x1="112" y1="52" 
      x2="112" y2="188" 
      stroke="currentColor" 
      stroke-width="11" 
      stroke-linecap="square"
    />

    <!-- Horizontal Bottom Extended Base Bar -->
    <line 
      x1="70" y1="188" 
      x2="185" y2="188" 
      stroke="currentColor" 
      stroke-width="11" 
      stroke-linecap="square"
    />

    <!-- Top Loop of 'B' -->
    <path 
      d="M 112 78 
         H 170 
         C 188 78, 196 86, 196 102 
         C 196 118, 188 124, 170 124 
         H 112" 
      stroke="currentColor" 
      stroke-width="11" 
      stroke-linecap="square" 
      stroke-linejoin="round"
    />

    <!-- Bottom Loop of 'B' -->
    <path 
      d="M 112 124 
         H 172 
         C 192 124, 202 134, 202 154 
         C 202 174, 190 188, 170 188" 
      stroke="currentColor" 
      stroke-width="11" 
      stroke-linecap="square" 
      stroke-linejoin="round"
    />
  </g>
</svg>
